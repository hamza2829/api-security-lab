name: Security checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install native Gitleaks binary, without Docker
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL --retry 3 "$base/$archive" -o "$archive"
          curl -fsSL --retry 3 "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$archive" gitleaks
          mkdir -p reports
      - name: Show the intentional vulnerable-folder secret
        run: >-
          ./gitleaks dir app_vulnerable --config .gitleaks.toml --no-banner
          --redact --report-format json --report-path reports/gitleaks-vulnerable.json
          --exit-code 0
      - name: Require the fake-key detection
        run: python scripts/check_gitleaks.py reports/gitleaks-vulnerable.json
      - name: Fail on any fixed-folder secret
        run: >-
          ./gitleaks dir app_fixed --config .gitleaks.toml --no-banner
          --redact --report-format json --report-path reports/gitleaks-fixed.json
      - name: Upload secret-scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-reports
          path: reports/gitleaks-*.json
          if-no-files-found: error

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install pip-audit==2.10.1
      - run: mkdir -p reports
      - name: Audit the pinned application and test dependency set
        run: python -m pip_audit -r requirements.txt --format json --output reports/pip-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pip-audit-report
          path: reports/pip-audit.json
          if-no-files-found: error

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install semgrep==1.182.1
      - run: mkdir -p reports
      - name: Scan both apps with reviewable local rules
        run: >-
          semgrep scan --config .semgrep.yml --metrics=off --strict
          --sarif --output reports/semgrep.sarif app_vulnerable app_fixed
      - name: Require teaching findings and fail on fixed-app findings
        run: python scripts/check_semgrep.py reports/semgrep.sarif
      - name: Upload code-scanning results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sarif
          path: reports/semgrep.sarif
          if-no-files-found: error
